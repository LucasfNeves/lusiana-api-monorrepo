name: API CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      # Histórico completo: o Sonar usa o git blame para saber o que é código novo.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm pkg delete scripts.prepare
        shell: bash

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Só dependências de produção e só high/critical: as moderadas e as de dev não chegam ao servidor.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck and tests
        run: pnpm validate

      # Lê o coverage/lcov.info gerado pelo validate; a configuração fica em sonar-project.properties.
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
