# SonarQube Cloud (plano Free). Organização e projeto: confira as chaves em Administration > Update Key.
sonar.organization=lucasfneves
sonar.projectKey=LucasfNeves_lusiana-api-monorrepo
sonar.projectName=lusiana-api-monorrepo
sonar.sourceEncoding=UTF-8

# O SonarQube Cloud analisa o repositório inteiro (sonar.sources e sonar.tests não têm mais efeito);
# o escopo se recorta só por exclusão. Os testes ficam fora para não contarem no limite de linhas.
sonar.exclusions=src/generated/**,src/**/tests/**

# Mesmo recorte de cobertura do vitest.config.ts, para os dois números baterem. Os *.config.* da raiz
# configuram ferramentas e o Vitest não os mede.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/**/*.module.ts,src/**/*.interface.ts,src/**/index.ts,src/main/main.ts,*.config.ts,*.config.mjs

# O CI espera o quality gate e reprova se ele falhar.
sonar.qualitygate.wait=true
