allowBuilds:
  '@prisma/engines': false
  '@swc/core': false
  cpu-features: false
  esbuild: false
  prisma: false
  protobufjs: false
  ssh2: false
  unrs-resolver: true

# Correções de segurança que as dependências diretas ainda não trazem (pnpm audit, 2026-11-24).
# Remova cada uma quando o pacote que a puxa passar a trazer a versão corrigida.
overrides:
  # GHSA-q7qp-rjg7-q26m, via @nestjs/platform-express 12.1.3 (a 12.6.0 já traz a 2.5.0).
  multer: 2.5.0
  # GHSA-7589-6fvf-x4pw, via prisma > @prisma/config (até a 7.10.1 fixa a 3.20.0).
  effect: 3.22.5
